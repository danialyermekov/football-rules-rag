[project]
name = "football-rules"
version = "0.1.0"
description = "Bilingual (RU/EN) RAG assistant for IFAB Laws of the Game 2026/27"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Danial Yermekov", email = "danialrmkv@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fonttools==4.67.0",
    "google-genai==2.33.0",
    "instructor[google-genai]==1.17.0",
    "langchain-community==0.4.1",
    "langchain-text-splitters==1.1.3",
    "mlflow==3.17.2",
    "pypdf==6.21.2",
    "python-dotenv==1.2.4",
    "qdrant-client==1.20.0",
    "ragas==0.4.3",
    "sentence-transformers==6.2.0",
    "snowballstemmer==3.1.1",
]

[project.scripts]
football-rules = "football_rules:main"

[project.optional-dependencies]
cpu = ["torch===2.14.1"]
cuda = ["torch==2.14.1+cu130; sys_platform == 'win32'"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "cuda" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
